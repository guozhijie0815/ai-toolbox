<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fabd7a"/>
      <stop offset="45%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#d86933"/>
    </linearGradient>
    <linearGradient id="topLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- macOS 圆角底 -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="24" y="24" width="976" height="460" rx="206" fill="url(#topLight)"/>
  <rect x="24" y="540" width="976" height="460" rx="206" fill="#000000" fill-opacity="0.05"/>

  <!-- 节点网络：中心汇聚 + 周围 4 节点 -->
  <g transform="translate(512, 530)" filter="url(#softShadow)">
    <!-- 连线 -->
    <g stroke="#ffffff" stroke-width="28" stroke-linecap="round" opacity="0.92">
      <line x1="0" y1="0" x2="-210" y2="-175"/>
      <line x1="0" y1="0" x2="210" y2="-175"/>
      <line x1="0" y1="0" x2="-210" y2="175"/>
      <line x1="0" y1="0" x2="210" y2="175"/>
    </g>

    <!-- 外围节点 -->
    <circle cx="-210" cy="-175" r="52" fill="#ffffff"/>
    <circle cx="210" cy="-175" r="52" fill="#ffffff"/>
    <circle cx="-210" cy="175" r="52" fill="#ffffff"/>
    <circle cx="210" cy="175" r="52" fill="#ffffff"/>

    <!-- 中心枢纽（略大） -->
    <circle cx="0" cy="0" r="78" fill="#ffffff"/>
    <circle cx="0" cy="0" r="36" fill="#d86933"/>
  </g>
</svg>
